<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sovereign Fortress Auditor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .cherry-blossom-bg { background-image: radial-gradient(circle at 10% 20%, rgba(255, 192, 203, 0.05) 0%, transparent 20%), radial-gradient(circle at 90% 80%, rgba(255, 192, 203, 0.05) 0%, transparent 20%); }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gold-glow { box-shadow: 0 0 15px rgba(251, 191, 36, 0.1); }
        .arsenal-glow { box-shadow: 0 0 15px rgba(16, 185, 129, 0.05); }
        input, select { background: rgba(15, 23, 42, 0.5) !important; border: 1px solid rgba(255, 255, 255, 0.1) !important; color: white !important; }
    </style>
</head>
<body class="cherry-blossom-bg min-h-screen pb-24">
    <header class="p-6 flex justify-between items-start sticky top-0 z-30 bg-[#0f172a]/80 backdrop-blur-md border-b border-white/5">
        <div>
            <h1 class="text-2xl font-black tracking-tighter uppercase text-white">The Fortress</h1>
            <p id="current-date" class="text-[10px] font-bold text-amber-400 tracking-[0.15em] uppercase mt-1"></p>
        </div>
        <div class="text-right">
            <span class="block text-[10px] text-slate-500 font-bold uppercase tracking-widest">Payday (12th)</span>
            <div class="flex items-baseline justify-end space-x-1">
                <span id="countdown" class="text-3xl font-black text-rose-500 leading-none">0</span>
                <span class="text-xs font-bold text-rose-500/70 uppercase">Days</span>
            </div>
        </div>
    </header>
    <main class="max-w-md mx-auto px-6 pt-6 space-y-6">
        <div class="glass rounded-[2rem] p-6 relative overflow-hidden arsenal-glow border-emerald-500/20">
            <div class="flex justify-between items-end mb-4">
                <div>
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Monthly Arsenal</p>
                    <p class="text-2xl font-black text-white">$8,882.88</p>
                </div>
                <div class="text-right">
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Remaining</p>
                    <p id="remaining-display" class="text-2xl font-black text-emerald-400">$8,882.88</p>
                </div>
            </div>
            <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden mb-2">
                <div id="arsenal-bar" class="bg-gradient-to-r from-emerald-400 to-amber-400 h-full w-0 transition-all duration-1000"></div>
            </div>
            <div class="flex justify-between text-[10px] font-bold uppercase tracking-widest">
                <span class="text-slate-500">Ledger Expenses</span>
                <span id="total-spent-display" class="text-rose-400">$0.00</span>
            </div>
        </div>
        <div class="glass rounded-[2rem] p-6 relative overflow-hidden gold-glow">
            <div class="relative z-10">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Cash Core</p>
                        <div class="flex items-center space-x-3 mb-2">
                            <span id="cash-display" class="text-3xl font-black text-white">$0</span>
                            <button id="edit-cash-btn" class="bg-white/10 p-2 rounded-full"><i class="ph-bold ph-pencil-simple text-amber-400"></i></button>
                        </div>
                    </div>
                </div>
                <div class="space-y-2 mt-4">
                    <div class="flex justify-between text-[10px] font-bold uppercase tracking-widest">
                        <span class="text-slate-400">Progress to $30k</span><span id="progress-percent" class="text-amber-400">0%</span>
                    </div>
                    <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                        <div id="progress-bar" class="bg-gradient-to-r from-amber-500 to-rose-500 h-full w-0"></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div class="glass rounded-3xl p-4 flex flex-col items-center justify-center text-center border-rose-500/20">
                <i class="ph-bold ph-skull text-rose-500 text-2xl mb-1"></i>
                <span id="toxic-tax-display" class="text-2xl font-black text-white">$0</span>
                <span class="text-[9px] font-bold text-slate-500 uppercase tracking-widest mt-1">Toxic Tax Owed</span>
            </div>
            <div class="bg-gradient-to-br from-slate-800 to-slate-900 rounded-3xl p-4 flex flex-col justify-center text-center">
                <h3 class="text-amber-500 font-bold text-[9px] uppercase tracking-[0.2em] mb-1">Target Sanctuary</h3>
                <p class="text-sm font-bold text-slate-100 leading-tight">AMK / Bishan<br><span class="text-slate-400 text-xs font-medium">Cherry Blossom</span></p>
            </div>
        </div>
        <div class="space-y-4 pt-2 relative z-20">
            <div class="flex items-center justify-between">
                <h2 class="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em]"><i class="ph-bold ph-list-dashes mr-2"></i> Audit Logs</h2>
                <button id="add-btn" class="bg-amber-500 text-black w-12 h-12 rounded-full flex items-center justify-center"><i class="ph-bold ph-plus text-xl"></i></button>
            </div>
            <div id="log-container" class="space-y-3 pb-10"></div>
        </div>
    </main>
    <div id="modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-end sm:items-center justify-center hidden p-4">
        <div class="glass w-full max-w-md rounded-[2.5rem] p-8 space-y-6" id="modal-content">
    <script>
        const TARGET = 30000; const MONTHLY_SALARY = 8882.88;
        let state = { savings: 0, expenses: [], isToxic: false };

        document.getElementById('add-btn').addEventListener('click', () => document.getElementById('modal').classList.remove('hidden'));
        document.getElementById('close-btn').addEventListener('click', () => document.getElementById('modal').classList.add('hidden'));
        document.getElementById('edit-cash-btn').addEventListener('click', () => {
            const val = prompt("Enter cash savings:", state.savings || 0);
            if (val !== null && !isNaN(val)) { state.savings = parseFloat(val); saveData(); }
        });
        document.getElementById('toxic-toggle').addEventListener('click', () => {
            state.isToxic = !state.isToxic;
            document.getElementById('toxic-icon').className = `ph-fill ph-skull text-2xl ${state.isToxic ? 'text-rose-500' : 'text-slate-600'}`;
            document.getElementById('toxic-check').innerHTML = `<i class="ph-bold ph-check text-white text-xs ${state.isToxic ? 'opacity-100' : 'opacity-0'}"></i>`;
        });
        document.getElementById('expense-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const desc = document.getElementById('exp-desc').value;
            const amt = parseFloat(document.getElementById('exp-amt').value);
            if (!desc || isNaN(amt)) return;
            state.expenses.unshift({ id: Date.now(), desc, amt, cat: document.getElementById('exp-cat').value, isToxic: state.isToxic, date: new Date().getTime() });
            document.getElementById('expense-form').reset();
            if(state.isToxic) document.getElementById('toxic-toggle').click();
            document.getElementById('modal').classList.add('hidden');
            saveData();
        });
        window.deleteItem = (id) => { state.expenses = state.expenses.filter(x => x.id !== id); saveData(); }

        function loadData() {
            try { const saved = localStorage.getItem('sov_v4'); if (saved) state = JSON.parse(saved); } catch (e) {}
            if(!state.expenses) state.expenses = [];
            updateUI();
        }
        function saveData() { localStorage.setItem('sov_v4', JSON.stringify(state)); updateUI(); }

        function updateUI() {
            const today = new Date();
            document.getElementById('current-date').innerText = today.toLocaleDateString('en-SG', { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' });
            
            let payday = new Date(today.getFullYear(), today.getMonth(), 12);
            if (today.getDate() > 12) payday.setMonth(payday.getMonth() + 1);
            document.getElementById('countdown').innerText = Math.max(0, Math.ceil((payday - today) / 86400000));

            const totalSpent = state.expenses.reduce((sum, x) => sum + (Number(x.amt) || 0), 0);
            document.getElementById('total-spent-display').innerText = '$' + totalSpent.toLocaleString('en-SG', {minimumFractionDigits: 2});
            document.getElementById('remaining-display').innerText = '$' + (MONTHLY_SALARY - totalSpent).toLocaleString('en-SG', {minimumFractionDigits: 2});
            
            const currentSavings = Number(state.savings) || 0;
            document.getElementById('cash-display').innerText = `$${currentSavings.toLocaleString('en-SG')}`;
            document.getElementById('progress-bar').style.width = Math.min((currentSavings / TARGET) * 100, 100) + '%';
            document.getElementById('progress-percent').innerText = Math.round(Math.min((currentSavings / TARGET) * 100, 100)) + '%';
            
            const tax = state.expenses.filter(x => x.isToxic).reduce((sum, x) => sum + ((Number(x.amt) || 0) * 0.2), 0);
            document.getElementById('toxic-tax-display').innerText = `$${Math.round(tax).toLocaleString('en-SG')}`;

            const container = document.getElementById('log-container');
            container.innerHTML = state.expenses.length === 0 ? `<div class="p-8 text-center bg-white/5"><p class="text-slate-400 text-xs">No expenses logged.</p></div>` : '';
            state.expenses.forEach(x => {
                const dateStr = x.date ? new Date(x.date).toLocaleDateString('en-SG', { day: '2-digit', month: 'short' }) : "Recent";
                const amtNum = Number(x.amt) || 0;
                container.innerHTML += `<div class="glass p-4 rounded-2xl flex justify-between items-center"><div class="flex items-center space-x-3"><div class="w-10 h-10 rounded-xl flex items-center justify-center ${x.isToxic ? 'bg-rose-500/10 text-rose-500' : 'bg-white/5 text-emerald-400'}"><i class="ph-fill ${x.isToxic ? 'ph-skull' : 'ph-receipt'} text-xl"></i></div><div><h4 class="font-bold text-sm text-white">${x.desc}</h4><p class="text-[9px] text-slate-500 uppercase">${x.cat} • ${dateStr}</p></div></div><div class="flex items-center"><div class="text-right"><p class="font-black text-sm ${x.isToxic ? 'text-rose-500' : 'text-slate-200'}">$${amtNum.toLocaleString('en-SG', {minimumFractionDigits: 2})}</p>${x.isToxic ? `<p class="text-[8px] text-rose-400 uppercase">Tax: $${(amtNum * 0.2).toFixed(2)}</p>` : ''}</div><button onclick="deleteItem(${x.id})" class="text-slate-600 ml-2 p-2"><i class="ph-bold ph-trash"></i></button></div></div>`;
            });
        }
        window.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
